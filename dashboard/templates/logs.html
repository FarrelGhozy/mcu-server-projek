{% extends "base.html" %}
{% block title %}Logs - Tlaucer Server{% endblock %}
{% block content %}
<div class="bg-mc-card rounded-lg border border-gray-700 p-4">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-sm uppercase tracking-wide text-gray-400">📝 Server Logs</h2>
        <div class="flex gap-2">
            <select id="level-filter" class="bg-gray-800 border border-gray-600 text-xs rounded px-2 py-1">
                <option value="">All Levels</option>
                <option value="info">INFO</option>
                <option value="warn">WARN</option>
                <option value="error">ERROR</option>
            </select>
            <input id="search-input" type="text" placeholder="Search..." class="bg-gray-800 border border-gray-600 text-xs rounded px-2 py-1 w-40">
            <button onclick="refreshLogs()" class="bg-mc-accent text-xs px-3 py-1 rounded hover:bg-blue-800">Refresh</button>
        </div>
    </div>
    <div id="log-container" class="bg-black rounded p-3 h-[600px] overflow-y-auto font-mono text-xs leading-5 whitespace-pre-wrap"></div>
</div>
{% endblock %}
