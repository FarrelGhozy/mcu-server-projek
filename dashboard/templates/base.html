<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tlaucer Server Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { mc: { bg: '#1a1a2e', card: '#16213e', accent: '#0f3460', highlight: '#e94560', text: '#e0e0e0' } } } } }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <meta http-equiv="refresh" content="30">
</head>
<body class="bg-mc-bg text-mc-text font-mono">
    <nav class="bg-mc-card border-b border-gray-700 px-6 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-6">
                <a href="/" class="text-lg font-bold text-mc-highlight">🎮 Tlaucer Server</a>
                <a href="/" class="hover:text-mc-highlight text-sm">Dashboard</a>
                <a href="/logs" class="hover:text-mc-highlight text-sm">Logs</a>
                <a href="/rcon" class="hover:text-mc-highlight text-sm">RCON</a>
                <a href="/backups" class="hover:text-mc-highlight text-sm">Backups</a>
            </div>
            <div id="server-indicator" class="flex items-center gap-2 text-xs">
                <span class="w-2 h-2 rounded-full bg-gray-500"></span>
                <span>Checking...</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-xs text-gray-600 py-4">
        Tlaucer Minecraft Server &mdash; mcu.utc.web.id &mdash; Paper 26.1.2
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
