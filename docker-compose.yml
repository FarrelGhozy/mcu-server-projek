services:
  minecraft-server:
    image: itzg/minecraft-server:latest
    container_name: minecraft-tlaucer-server
    ports:
      - "8443:25565"
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "false"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      MEMORY: "4096M"
      JVM_OPTS: "-Xmx4096M -Xms2048M"
      DIFFICULTY: "2"
      GAMEMODE: "0"
      PVP: "true"
      ALLOW_FLIGHT: "false"
      MAX_PLAYERS: "20"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "mcusiman123"
      RCON_PORT: "25575"
    volumes:
      - /home/ghozy/Server-Tlaucer:/data
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: minecraft-dashboard
    ports:
      - "5000:5000"
    environment:
      RCON_HOST: "minecraft-server"
      RCON_PORT: 25575
      RCON_PASSWORD: "mcusiman123"
      DASHBOARD_USER: "admin"
      DASHBOARD_PASSWORD: "admin123"
    volumes:
      - /home/ghozy/Server-Tlaucer:/data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - minecraft-server
    restart: unless-stopped
